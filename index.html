<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self';" />
  <meta name="theme-color" content="#0f172a" />
  <title>GymLog 366</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-dark: #059669;
      --danger: #ef4444;
      --danger-dark: #dc2626;
      --today: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 540px;
      margin: 0 auto;
      padding-bottom: 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { font-size: 0.75rem; color: var(--muted); display: block; font-weight: 500; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .stat-lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
    .progress-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .progress-head { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 6px; color: var(--muted); }
    .progress-bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.25s ease; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #022c22;
      border-color: var(--accent);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .cal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-nav h2 { font-size: 1.05rem; font-weight: 700; }
    .icon-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .weekdays, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .weekdays div { font-size: 0.72rem; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
    .day-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .day-cell.empty, .day-cell.out-of-range {
      background: transparent;
      border-color: transparent;
      color: #334155;
      cursor: default;
    }
    .day-cell.logged {
      background: var(--accent);
      border-color: var(--accent);
      color: #022c22;
      font-weight: 800;
    }
    .day-cell.today {
      outline: 2px solid var(--today);
      outline-offset: 1px;
    }
    .quick-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #022c22;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
    }
    .quick-btn.logged-today {
      background: var(--bg);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .year-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .mini-month {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .mini-title { font-size: 0.78rem; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; color: var(--muted); }
    .mini-dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .dot { aspect-ratio: 1; border-radius: 3px; background: #1e293b; }
    .dot.out { background: transparent; }
    .dot.on { background: var(--accent); }
    .btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-primary { background: var(--accent); color: #022c22; border-color: var(--accent); font-weight: 700; }
    .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    .btn-danger.confirm { background: var(--danger); color: #fff; }
    textarea {
      width: 100%;
      min-height: 90px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      margin-bottom: 10px;
      resize: vertical;
    }
    .msg { font-size: 0.82rem; color: var(--accent); margin-top: 4px; min-height: 1.2em; }
    .msg.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#1e293b"/>
        <g fill="#10b981">
          <rect x="136" y="236" width="240" height="40" rx="12"/>
          <rect x="96" y="156" width="44" height="200" rx="14"/>
          <rect x="52" y="186" width="36" height="140" rx="12"/>
          <rect x="372" y="156" width="44" height="200" rx="14"/>
          <rect x="424" y="186" width="36" height="140" rx="12"/>
        </g>
      </svg>
      <div>
        <h1>GymLog 366</h1>
        <span>Nov 10, 2026 &ndash; Nov 10, 2027</span>
      </div>
    </div>
  </header>

  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="stat-total">0</div>
      <div class="stat-lbl">Logged</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-streak">0</div>
      <div class="stat-lbl">Current Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-best">0</div>
      <div class="stat-lbl">Best Streak</div>
    </div>
  </section>

  <section class="progress-wrap">
    <div class="progress-head">
      <span>366-Day Window Progress</span>
      <span id="stat-pct">0.0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </section>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="calendar">Calendar</button>
    <button class="tab-btn" data-tab="year">Year View</button>
    <button class="tab-btn" data-tab="backup">Backup</button>
  </nav>

  <main>
    <section id="panel-calendar" class="panel active">
      <div class="card">
        <div class="cal-nav">
          <button class="icon-btn" id="prev-month" aria-label="Previous month">&lsaquo;</button>
          <h2 id="month-label">November 2026</h2>
          <button class="icon-btn" id="next-month" aria-label="Next month">&rsaquo;</button>
        </div>
        <div class="weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="days-grid" id="days-grid"></div>
        <button class="quick-btn" id="today-btn">Log Today</button>
      </div>
    </section>

    <section id="panel-year" class="panel">
      <div class="card">
        <div class="year-grid" id="year-grid"></div>
      </div>
    </section>

    <section id="panel-backup" class="panel">
      <div class="card">
        <h2 style="font-size:1rem; margin-bottom:10px;">Export &amp; Restore</h2>
        <a id="export-link" class="btn btn-primary" download="gymlog-366-backup.json" href="#">Download JSON Backup</a>
        <textarea id="restore-input" placeholder="Paste exported JSON here to restore..."></textarea>
        <button class="btn" id="restore-btn">Restore from JSON</button>
        <div class="msg" id="backup-msg"></div>
      </div>
      <div class="card">
        <h2 style="font-size:1rem; margin-bottom:10px;">Danger Zone</h2>
        <button class="btn btn-danger" id="reset-btn">Reset All Data</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = 'gymlog_366_v1';
      const START_DATE = '2026-11-10';
      const END_DATE = '2027-11-10';
      const TOTAL_DAYS = 366;
      const MONTHS = [
        [2026, 10], [2026, 11],
        [2027, 0], [2027, 1], [2027, 2], [2027, 3], [2027, 4], [2027, 5],
        [2027, 6], [2027, 7], [2027, 8], [2027, 9], [2027, 10]
      ];
      const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

      let logged = loadData();
      let currentMonthIdx = getInitialMonthIndex();
      let resetArmed = false;
      let resetTimer = null;

      function fmtDate(y, m, d) {
        return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      }

      function getTodayStr() {
        const now = new Date();
        return fmtDate(now.getFullYear(), now.getMonth(), now.getDate());
      }

      function inRange(ds) {
        return ds >= START_DATE && ds <= END_DATE;
      }

      function getInitialMonthIndex() {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth();
        const idx = MONTHS.findIndex(([my, mm]) => my === y && mm === m);
        return idx >= 0 ? idx : 0;
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return new Set();
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return new Set();
          return new Set(arr.filter((d) => typeof d === 'string' && inRange(d)));
        } catch (e) {
          return new Set();
        }
      }

      function saveData() {
        const sorted = Array.from(logged).sort();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sorted));
        updateExportLink(sorted);
      }

      function updateExportLink(sorted) {
        const payload = JSON.stringify({ app: 'GymLog 366', start: START_DATE, end: END_DATE, days: sorted }, null, 2);
        const link = document.getElementById('export-link');
        link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(payload);
      }

      function computeStreaks() {
        let best = 0, run = 0;
        const start = new Date(2026, 10, 10);
        const end = new Date(2027, 10, 10);
        const todayStr = getTodayStr();
        for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
          const ds = fmtDate(dt.getFullYear(), dt.getMonth(), dt.getDate());
          if (logged.has(ds)) {
            run++;
            if (run > best) best = run;
          } else {
            run = 0;
          }
        }
        // Current streak ending today or yesterday
        let current = 0;
        let check = new Date();
        let ds = fmtDate(check.getFullYear(), check.getMonth(), check.getDate());
        if (!logged.has(ds)) {
          check.setDate(check.getDate() - 1);
          ds = fmtDate(check.getFullYear(), check.getMonth(), check.getDate());
        }
        while (inRange(ds) && logged.has(ds)) {
          current++;
          check.setDate(check.getDate() - 1);
          ds = fmtDate(check.getFullYear(), check.getMonth(), check.getDate());
        }
        return { current, best };
      }

      function renderStats() {
        const count = logged.size;
        const { current, best } = computeStreaks();
        const pct = ((count / TOTAL_DAYS) * 100).toFixed(1);
        document.getElementById('stat-total').textContent = count;
        document.getElementById('stat-streak').textContent = current;
        document.getElementById('stat-best').textContent = best;
        document.getElementById('stat-pct').textContent = pct + '%';
        document.getElementById('progress-fill').style.width = Math.min(100, (count / TOTAL_DAYS) * 100) + '%';
      }

      function renderCalendar() {
        const [y, m] = MONTHS[currentMonthIdx];
        document.getElementById('month-label').textContent = MONTH_NAMES[m] + ' ' + y;
        document.getElementById('prev-month').disabled = currentMonthIdx === 0;
        document.getElementById('next-month').disabled = currentMonthIdx === MONTHS.length - 1;

        const grid = document.getElementById('days-grid');
        grid.innerHTML = '';
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const todayStr = getTodayStr();

        for (let i = 0; i < firstDay; i++) {
          const el = document.createElement('div');
          el.className = 'day-cell empty';
          grid.appendChild(el);
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = fmtDate(y, m, d);
          const el = document.createElement('button');
          el.type = 'button';
          el.className = 'day-cell';
          el.textContent = d;
          if (!inRange(ds)) {
            el.classList.add('out-of-range');
            el.disabled = true;
          } else {
            if (logged.has(ds)) el.classList.add('logged');
            if (ds === todayStr) el.classList.add('today');
            el.addEventListener('click', () => toggleDate(ds));
          }
          grid.appendChild(el);
        }

        const todayBtn = document.getElementById('today-btn');
        if (!inRange(todayStr)) {
          todayBtn.style.display = 'none';
        } else {
          todayBtn.style.display = 'block';
          if (logged.has(todayStr)) {
            todayBtn.textContent = 'Logged Today (Tap to Undo)';
            todayBtn.classList.add('logged-today');
          } else {
            todayBtn.textContent = 'Log Today (' + todayStr + ')';
            todayBtn.classList.remove('logged-today');
          }
        }
      }

      function renderYear() {
        const container = document.getElementById('year-grid');
        container.innerHTML = '';
        MONTHS.forEach(([y, m], idx) => {
          const box = document.createElement('div');
          box.className = 'mini-month';
          const daysInMonth = new Date(y, m + 1, 0).getDate();
          const firstDay = new Date(y, m, 1).getDay();
          let mCount = 0;
          const dots = document.createElement('div');
          dots.className = 'mini-dots';
          for (let i = 0; i < firstDay; i++) {
            const d = document.createElement('div');
            d.className = 'dot out';
            dots.appendChild(d);
          }
          for (let day = 1; day <= daysInMonth; day++) {
            const ds = fmtDate(y, m, day);
            const d = document.createElement('div');
            if (!inRange(ds)) {
              d.className = 'dot out';
            } else if (logged.has(ds)) {
              d.className = 'dot on';
              mCount++;
            } else {
              d.className = 'dot';
            }
            dots.appendChild(d);
          }
          const title = document.createElement('div');
          title.className = 'mini-title';
          title.innerHTML = '<span>' + MONTH_NAMES[m].slice(0, 3) + ' ' + y + '</span><span>' + mCount + '</span>';
          box.appendChild(title);
          box.appendChild(dots);
          box.style.cursor = 'pointer';
          box.addEventListener('click', () => {
            currentMonthIdx = idx;
            switchTab('calendar');
            renderCalendar();
          });
          container.appendChild(box);
        });
      }

      function toggleDate(ds) {
        if (!inRange(ds)) return;
        if (logged.has(ds)) logged.delete(ds);
        else logged.add(ds);
        saveData();
        renderAll();
      }

      function renderAll() {
        renderStats();
        renderCalendar();
        renderYear();
      }

      function switchTab(name) {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === 'panel-' + name));
      }

      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
      document.getElementById('prev-month').addEventListener('click', () => {
        if (currentMonthIdx > 0) { currentMonthIdx--; renderCalendar(); }
      });
      document.getElementById('next-month').addEventListener('click', () => {
        if (currentMonthIdx < MONTHS.length - 1) { currentMonthIdx++; renderCalendar(); }
      });
      document.getElementById('today-btn').addEventListener('click', () => toggleDate(getTodayStr()));

      document.getElementById('restore-btn').addEventListener('click', () => {
        const msg = document.getElementById('backup-msg');
        const raw = document.getElementById('restore-input').value.trim();
        msg.classList.remove('err');
        if (!raw) { msg.textContent = 'Paste JSON backup first.'; msg.classList.add('err'); return; }
        try {
          const parsed = JSON.parse(raw);
          const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.days) ? parsed.days : null);
          if (!arr) throw new Error('Invalid format');
          logged = new Set(arr.filter((d) => typeof d === 'string' && inRange(d)));
          saveData();
          renderAll();
          msg.textContent = 'Restored ' + logged.size + ' logged days.';
        } catch (e) {
          msg.textContent = 'Invalid JSON backup.';
          msg.classList.add('err');
        }
      });

      document.getElementById('reset-btn').addEventListener('click', () => {
        const btn = document.getElementById('reset-btn');
        if (!resetArmed) {
          resetArmed = true;
          btn.textContent = 'Tap Again to Confirm Reset';
          btn.classList.add('confirm');
          resetTimer = setTimeout(() => {
            resetArmed = false;
            btn.textContent = 'Reset All Data';
            btn.classList.remove('confirm');
          }, 4000);
        } else {
          clearTimeout(resetTimer);
          resetArmed = false;
          logged.clear();
          saveData();
          renderAll();
          btn.textContent = 'Reset All Data';
          btn.classList.remove('confirm');
        }
      });

      saveData();
      renderAll();

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
